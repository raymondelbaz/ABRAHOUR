<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABRA. — לוח ניהול הכנסות</title>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#070C1B;--bg2:#0C1426;--card:#111928;--border:rgba(80,120,200,.14);--border2:rgba(80,120,200,.28);
  --txt:#DDE4F5;--txt2:#7A90BE;--txt3:#3D4E6E;
  --blue:#4E7EF9;--blue-d:rgba(78,126,249,.13);
  --green:#0FC98B;--green-d:rgba(15,201,139,.13);
  --rose:#F0476A;--rose-d:rgba(240,71,106,.13);
  --amber:#F8A623;--amber-d:rgba(248,166,35,.13);
  --purple:#8B5CF6;--purple-d:rgba(139,92,246,.13);
  --r:12px;--r2:18px
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Assistant',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;direction:rtl;
  background-image:radial-gradient(ellipse 70% 50% at 15% 5%,rgba(78,126,249,.05) 0%,transparent 60%),
  radial-gradient(ellipse 50% 40% at 85% 90%,rgba(139,92,246,.04) 0%,transparent 50%)}

/* HEADER - FIXED */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0.8rem 2rem;
  border-bottom:1px solid var(--border);background:rgba(7,12,27,.95);
  backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;gap:.75rem;flex-wrap:wrap;height:80px}
.logo{font-size:1.6rem;font-weight:800;letter-spacing:-1px;color:var(--txt)}
.logo em{color:var(--blue);font-style:normal}
.main-title { font-size: 1.1rem; font-weight: 800; color: #FFF; margin-right: 1.5rem; }

/* HERO BANNER - STICKY & RESPONSIVE (v37) */
.hero-banner-sticky {
  width: 100%;
  height: 200px; /* גובה בסיס למחשב */
  
  /* תמונת רקע חכמה למניעת מריחה */
  background-image: url('banner.webp'); 
  background-size: cover;    /* ממלא את המרחב פרופורציונלית */
  background-position: center; /* שומר על מרכז התמונה גלוי */
  background-repeat: no-repeat;
  
  /* הגדרות הצמדה (Sticky) */
  position: sticky;
  top: 80px;  /* מתחיל בדיוק מתחת ל-Header (שגובהו 80) */
  z-index: 90; /* מתחת ל-Header (100) ומעל התוכן */
  
  border-bottom: 1px solid var(--border);
  box-shadow: 0 4px 15px rgba(0,0,0,0.4); /* צל כדי להדגיש את הציפה */
}

/* התאמה למובייל */
@media (max-width: 768px) {
  .hero-banner-sticky {
    height: 120px; /* נקטין את הגובה במסכים קטנים */
    top: 110px; /* ה-Header במובייל בד"כ גבוה יותר בגלל שבירת שורות */
  }
}

.bal-box{display:flex;align-items:center;gap:.55rem;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.35rem .75rem}
.bal-in{background:transparent;border:none;color:var(--txt);font-family:inherit;font-size:.85rem;font-weight:700;width:75px;text-align:center;outline:none}
.tog{position:relative;width:32px;height:18px;cursor:pointer}
.tog input{opacity:0;width:0;height:0}
.sli{position:absolute;inset:0;background:var(--txt3);border-radius:20px;transition:.25s}
.sli:before{content:'';position:absolute;width:12px;height:12px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.25s}
input:checked+.sli{background:var(--green)}
input:checked+.sli:before{transform:translateX(-14px)}

/* KPI & GAUGES */
.top-row { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; margin: 1.5rem 2rem; }
.kpi-compact{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem; text-align:center; display:flex; flex-direction:column; justify-content:center;}
.kpi-compact .klbl{font-size:.75rem; color:var(--txt2); margin-bottom:.3rem; text-transform:uppercase}
.big{font-size:2.8rem; font-weight:800; letter-spacing:-1px}
.big.pos{color:var(--green)}.big.neg{color:var(--rose)}
.gauges-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
.gc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.gw{position:relative;width:80px;height:80px}
.gcin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.gcin .gn{font-size:1rem;font-weight:800}

/* MAIN LAYOUT */
.main{padding:0 2rem 1.5rem;max-width:1600px;margin:0 auto}
.g2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:1.5rem; min-height: 350px;}
.ct{font-size:.93rem;font-weight:700;margin-bottom:1.1rem;display:flex;align-items:center;gap:.45rem}
.dot{width:7px;height:7px;border-radius:50%}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:.73rem;color:var(--txt2);font-weight:700;padding:.6rem;border-bottom:1px solid var(--border);text-align:right}
.tbl td{padding:.7rem .6rem;border-bottom:1px solid var(--border);font-size:.86rem}
.sum-row-active { background: rgba(78,126,249,.06); border-right: 3px solid var(--blue); }

/* MODAL & TIMESHEET */
.overlay{position:fixed;inset:0;background:rgba(3,6,15,.96);z-index:200;display:none;flex-direction:column;backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{flex:1;display:flex;flex-direction:column;max-width:1300px;width:100%;margin:0 auto;padding:.75rem 1rem;overflow:hidden}
.msticky{background:rgba(7,12,27,.97);backdrop-filter:blur(10px);padding:.7rem 0 0;border-bottom:1px solid var(--border)}
.tsrow{display:grid;grid-template-columns:35px 45px 70px 75px 75px 55px 70px 35px 35px 180px;gap:4px;padding:.26rem .4rem;border-bottom:1px solid var(--border);align-items:center;}
.tsrow.weekend { background: rgba(78, 126, 249, 0.15) !important; }
.tsrow.split-b { border-right: 4px solid var(--rose); background: rgba(240, 71, 106, 0.1) !important; }

/* DAY HIGHLIGHT IN TS */
.day-name { color: #FFF !important; font-weight: 800 !important; }

.tsi{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:5px;color:var(--txt);font-size:.75rem;padding:.15rem .25rem;width:100%;text-align:center;outline:none;}
.hi{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--txt);padding:.22rem .38rem;width:80px;text-align:center;outline:none;}
.btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r);padding:.5rem 1.1rem;font-weight:700;cursor:pointer;}
.btn-g{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.btn-admin{background:var(--amber); color:var(--bg); margin-left:10px;}

input:disabled, select:disabled, .tsi:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

<div id="toast" style="position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);padding:.6rem 1.2rem;border-radius:var(--r);opacity:0;transition:0.35s;z-index:999;"></div>

<header class="hdr">
  <div style="display:flex; align-items:center;">
    <div class="logo">ABRA<em>.</em></div>
    <div class="main-title">כלי לניהול מערך שעות</div>
  </div>
  <div style="display:flex; align-items:center; gap:1rem;">
    <div class="bal-box">
      <label style="font-size:0.7rem; color:var(--txt2)">יתרת 2025</label>
      <input id="bal25" class="bal-in" type="number" placeholder="0" onchange="updateBal()">
      <label class="tog"><input type="checkbox" id="balTog" checked onchange="render()"><span class="sli"></span></label>
    </div>
    <div id="topMonthLabel" style="font-size:0.9rem; font-weight:700; color:var(--txt2)"></div>
    <button id="loginBtn" class="btn btn-admin" onclick="handleLogin()">🔓 כניסת מנהל</button>
    <button class="btn btn-g" onclick="openTS()">📋 גיליון שעות</button>
  </div>
</header>

<div class="hero-banner-sticky" id="stickyBanner"></div>

<div class="top-row">
  <div class="kpi-compact">
    <div class="klbl">דלתא מצטברת כוללת</div>
    <div class="big pos" id="totDelta">+₪0</div>
  </div>
  <div class="gauges-row" id="gaugesHub"></div>
</div>

<main class="main">
  <div class="g2">
    <div class="card">
      <div class="ct"><span class="dot" style="background:var(--blue)"></span>הזנת נתונים - <span id="navMN" style="color:var(--blue)"></span></div>
      <div style="display:flex; gap:0.5rem; margin-bottom:1.1rem;">
        <button onclick="prevM()" class="btn" style="padding:0.2rem 0.6rem;">‹</button>
        <button onclick="nextM()" class="btn" style="padding:0.2rem 0.6rem;">›</button>
      </div>
      <table class="tbl"><tbody id="etBody"></tbody></table>
    </div>

    <div class="card">
      <div class="ct"><span class="dot" style="background:var(--green)"></span>הכנסות חודשיות 2026</div>
      <div style="height:260px; position:relative;"><canvas id="mainChart"></canvas></div>
    </div>
  </div>

  <div class="card" style="min-height:auto;">
    <div class="ct"><span class="dot" style="background:var(--purple)"></span>סיכום שנתי מלא</div>
    <div style="overflow-x:auto;">
      <table class="tbl">
        <thead><tr><th>חודש</th><th>א' (שע)</th><th>ב' (שע)</th><th>מילואים</th><th>חופש</th><th>הכנסה</th><th>יעד</th><th>דלתא</th><th>מצטבר</th></tr></thead>
        <tbody id="sumBody"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="overlay" id="tsModal">
  <div class="modal">
    <div class="msticky">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
        <div style="display:flex; align-items:center; gap:0.7rem;">
          <span style="font-size:1.1rem; font-weight:800;">📋 גיליון שעות</span>
          <button onclick="tsPrev()" class="btn" style="padding:0.2rem 0.5rem">‹</button>
          <span id="tsMN" style="min-width:70px; text-align:center; font-weight:700;"></span>
          <button onclick="tsNext()" class="btn" style="padding:0.2rem 0.5rem">›</button>
          <span id="lockMsg" style="color:var(--rose); font-size:0.8rem; font-weight:700; margin-right:10px;"></span>
        </div>
        <button onclick="closeTS()" class="btn" style="background:var(--rose)">✕ סגור</button>
      </div>
      <div id="afPanel" style="display:grid; grid-template-columns: 1fr 320px; gap: 1rem; background:rgba(78,126,249,0.06); padding:1rem; border-radius:12px; margin-bottom:1rem; border:1px solid var(--border);">
        <div><span style="font-size:0.85rem; font-weight:800; color:var(--blue)">🪄 אשף אופטימיזציה (תקרה קשיחה)</span>
          <div style="display:flex; gap:0.8rem; align-items:center; margin-top:0.7rem;">
            <label style="font-size:0.75rem"><input type="checkbox" id="af_use_a" checked> א':</label> <input id="af_a" type="number" value="140" class="hi" style="width:55px">
            <label style="font-size:0.75rem"><input type="checkbox" id="af_use_b" checked> ב':</label> <input id="af_b" type="number" value="90" class="hi" style="width:55px">
            <button onclick="combinedAutoFill()" class="btn" style="font-size:0.85rem">שבץ</button>
            <button onclick="clearFill()" class="btn" style="background:transparent; border:1px solid var(--rose); color:var(--rose); font-size:0.85rem">נקה</button>
          </div>
        </div>
        <div id="modalGauges" style="display:flex; gap:1rem; justify-content: flex-end;"></div>
      </div>
      <div class="tscols" style="display:grid; grid-template-columns:35px 45px 70px 75px 75px 55px 70px 35px 35px 180px; gap:4px; padding:0.4rem; font-size:0.7rem; color:var(--txt3); font-weight:800;">
        <span>יום</span><span>שם</span><span>מעסיק</span><span>התחלה</span><span>סיום</span><span>שעות</span><span>הכנסה</span><span>חג</span><span>חופש</span><span>הערות</span>
      </div>
    </div>
    <div class="mbody" id="tsBody" style="overflow-y:auto; flex:1;"></div>
  </div>
</div>

<script>
const MN=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const MD=[31,28,31,30,31,30,31,31,30,31,30,31];
const DN_SHORT=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const RA=300, RB=227, TA=140, TB=90, MAX_DAY=12, TGT = m => m < 3 ? 60000 : 62000;
const CUR_MONTH = new Date().getMonth();

let D = Array.from({length:12}, () => ({a:0, b:0, mil_val:0, vac:0, ts:{}}));
let navM = CUR_MONTH, tsM = CUR_MONTH, mc = null, isAdmin = false;

const valFmt = v => (v === 0 ? '' : v);

function handleLogin() {
    if(isAdmin) { isAdmin = false; document.getElementById('loginBtn').innerHTML = "🔓 כניסת מנהל"; render(); return; }
    const user = prompt("משתמש:"); const pass = prompt("סיסמה:");
    if(typeof ADMIN_CONFIG !== 'undefined' && user === ADMIN_CONFIG.username && pass === ADMIN_CONFIG.password) {
        isAdmin = true; document.getElementById('loginBtn').innerHTML = "🔒 יציאת מנהל"; render();
    } else { alert("שגוי!"); }
}

function isLocked(m) {
    if(!isAdmin) return true;
    if (new Date() < new Date(2026, 4, 10)) return false;
    if (m >= CUR_MONTH) return false;
    if (m === CUR_MONTH - 1 && new Date().getDate() <= 10) return false;
    return true;
}

function load(){
  const s=localStorage.getItem('abra_v37'); if(s) D=JSON.parse(s);
  const b=localStorage.getItem('abra_b37'); if(b!=null) document.getElementById('bal25').value=b;
  const t=localStorage.getItem('abra_t37'); if(t!=null) document.getElementById('balTog').checked=t==='1';
  document.getElementById('topMonthLabel').innerHTML = `<span style="color:var(--blue)">${MN[CUR_MONTH]}</span>`;
}
function save(){ if(isAdmin) { localStorage.setItem('abra_v37', JSON.stringify(D)); localStorage.setItem('abra_b37', document.getElementById('bal25').value); localStorage.setItem('abra_t37', document.getElementById('balTog').checked?'1':'0'); } }

const inc = m => (D[m].a*RA + D[m].b*RB + (D[m].mil_val || 0));
function updateBal() { save(); render(); }

// ══ לוגיקת אשף מתוקנת ══
function combinedAutoFill(){
  if(isLocked(tsM)) return;
  const m = tsM, useA = document.getElementById('af_use_a').checked, useB = document.getElementById('af_use_b').checked;
  const targetA = useA ? parseFloat(document.getElementById('af_a').value) || 0 : 0;
  const targetB = useB ? parseFloat(document.getElementById('af_b').value) || 0 : 0;
  for(let d=1; d<=MD[m]; d++) { if(D[m].ts[d]) { D[m].ts[d].hrs = 0; D[m].ts[d].splitB = 0; D[m].ts[d].auto = false; } }
  const workingDays = [];
  for(let d=1; d<=MD[m]; d++){
    const dw=(4 + [0,31,59,90,120,151,181,212,243,273,304,334][m]+d-1)%7;
    if(dw < 5 && !D[m].ts[d]?.holiday && !D[m].ts[d]?.vacation) workingDays.push(d);
  }
  let remA = targetA, remB = targetB, dayIdx = 0;
  while(remA > 0 && dayIdx < workingDays.length) {
      const d = workingDays[dayIdx]; const hrs = Math.min(remA, MAX_DAY);
      D[m].ts[d] = {emp:'a', start:'08:30', hrs: hrs, auto: true};
      remA -= hrs; dayIdx++;
  }
  while(remB > 0 && dayIdx < workingDays.length) {
      const d = workingDays[dayIdx]; const hrs = Math.min(remB, MAX_DAY);
      D[m].ts[d] = {emp:'b', start:'08:30', hrs: hrs, auto: true};
      remB -= hrs; dayIdx++;
  }
  if(remB > 0 && useB) {
      workingDays.forEach(d => { if(remB <= 0) return; const day = D[m].ts[d];
          if(day && day.emp === 'a' && day.hrs < MAX_DAY) { const take = Math.min(remB, MAX_DAY - day.hrs); day.splitB = take; remB -= take; }
      });
  }
  rebuildTotals(m); renderTS(); save();
}

function rebuildTotals(m){
  let tA=0, tB=0, tV=0;
  Object.values(D[m].ts).forEach(day => {
    if(day.hrs > 0 && !day.holiday && !day.vacation) { 
      if(day.emp==='a') tA += day.hrs; else tB += day.hrs; 
      if(day.splitB) tB += day.splitB; 
    }
    if(day.vacation) tV++;
  });
  D[m].a = Math.round(tA*100)/100; D[m].b = Math.round(tB*100)/100; D[m].vac = tV;
}

function render(){
  const m = navM; document.getElementById('navMN').textContent = MN[m];
  document.getElementById('etBody').innerHTML = `
    <tr><td>מעסיק א' (שע)</td><td><input class="hi" type="number" ${isLocked(m)?'disabled':''} value="${valFmt(D[m].a)}" onchange="D[${m}].a=parseFloat(this.value)||0; render();"></td><td>${RA}</td><td>₪${Math.round(D[m].a*RA).toLocaleString()}</td></tr>
    <tr><td>מעסיק ב' (שע)</td><td><input class="hi" type="number" ${isLocked(m)?'disabled':''} value="${valFmt(D[m].b)}" onchange="D[${m}].b=parseFloat(this.value)||0; render();"></td><td>${RB}</td><td>₪${Math.round(D[m].b*RB).toLocaleString()}</td></tr>
    <tr><td>מילואים ₪</td><td><input class="hi" type="number" ${isLocked(m)?'disabled':''} value="${valFmt(D[m].mil_val)}" onchange="D[${m}].mil_val=parseFloat(this.value)||0; render();"></td><td>1</td><td>₪${(D[m].mil_val||0).toLocaleString()}</td></tr>
    <tr><td>חופשה (ימים)</td><td><input class="hi" type="number" ${isLocked(m)?'disabled':''} value="${valFmt(D[m].vac)}" onchange="D[${m}].vac=parseFloat(this.value)||0; render();"></td><td>—</td><td>—</td></tr>`;
  renderGauges('gaugesHub'); renderSum(); renderChart(); save();
}

function renderGauges(targetId){
  const m=(targetId==='modalGauges'?tsM:navM), d=D[m];
  const gd=[{id:targetId+'A',title:"א'",val:d.a,tgt:TA,color:'#4E7EF9'},{id:targetId+'B',title:"ב'",val:d.b,tgt:TB,color:'#0FC98B'}];
  if(targetId!=='modalGauges') gd.push({id:'gM',title:'מילואים',val:d.mil_val,tgt:15000,color:'#F8A623'},{id:'gV',title:'חופשה',val:d.vac,tgt:20,color:'#8B5CF6'});
  const hub=document.getElementById(targetId); hub.innerHTML='';
  gd.forEach(g=>{
    const div=document.createElement('div');
    const size = targetId === 'modalGauges' ? 100 : 80;
    if(targetId !== 'modalGauges') div.className='gc';
    else div.style.cssText = "background:var(--bg2); padding:0.4rem; border-radius:10px; border:1px solid var(--border); text-align:center;";
    div.innerHTML=`<div class="gct" style="font-size:0.65rem">${g.title}</div><div class="gw" style="width:${size}px; height:${size}px"><canvas id="${g.id}"></canvas><div class="gcin"><span class="gn" style="color:${g.color}">${Math.round(g.val)}</span></div></div>`;
    hub.appendChild(div);
    setTimeout(()=>{ const ctx=document.getElementById(g.id).getContext('2d'); new Chart(ctx,{type:'doughnut',data:{datasets:[{data:[Math.max(g.val,0.01), Math.max(g.tgt-g.val,0.01)],backgroundColor:[g.color,'rgba(255,255,255,0.05)'],borderWidth:0}]},options:{cutout:'75%',plugins:{legend:{display:false},tooltip:{enabled:false}}}}); },0);
  });
}

function renderSum(){
  let cum = (document.getElementById('balTog').checked ? parseFloat(document.getElementById('bal25').value)||0 : 0);
  document.getElementById('sumBody').innerHTML = MN.map((name, i) => {
    const total = inc(i), tgt = TGT(i), dlt = total - tgt; if(total > 0) cum += dlt;
    return `<tr class="${i===CUR_MONTH?'sum-row-active':''}"><td>${name} ${(!isAdmin && i<CUR_MONTH) || (isAdmin && isLocked(i))?'🔒':''}</td><td>${D[i].a}</td><td>${D[i].b}</td><td>${(D[i].mil_val||0).toLocaleString()}</td><td>${D[i].vac}</td><td>₪${Math.round(total).toLocaleString()}</td><td>₪${tgt.toLocaleString()}</td><td>${Math.round(dlt).toLocaleString()}</td><td>${Math.round(cum).toLocaleString()}</td></tr>`;
  }).join('');
  const tEl=document.getElementById('totDelta'); tEl.textContent=(cum>=0?"+":"")+"₪"+Math.round(cum).toLocaleString(); tEl.className='big '+(cum>=0?'pos':'neg');
}

const totalOnTopPlugin = { 
  id:'totalOnTop', 
  afterDatasetsDraw(chart){ 
    const {ctx}=chart; 
    chart.data.labels.forEach((l,i)=>{ 
      const t=D[i].a*RA+D[i].b*RB+(D[i].mil_val||0); 
      if(t>0){ 
        const meta=chart.getDatasetMeta(2); 
        const bar=meta.data[i]; 
        if(bar){ ctx.save(); ctx.textAlign='center'; ctx.fillStyle='#DDE4F5'; ctx.font='bold 10px Assistant'; 
          // מציג סכום מדויק עם פסיק אלפים (v37)
          ctx.fillText('₪'+Math.round(t).toLocaleString(), bar.x, bar.y-12); 
          ctx.restore(); 
        } 
      } 
    }); 
  } 
};

function renderChart(){
  const ctx = document.getElementById('mainChart').getContext('2d'); if(mc) mc.destroy();
  const maxVal = Math.max(...D.map((_,i)=>inc(i)), 80000);
  mc = new Chart(ctx, { type:'bar', plugins:[totalOnTopPlugin], data:{ labels:MN, datasets:[{label:"א'", data:D.map(d=>d.a*RA), backgroundColor:'rgba(78,126,249,0.8)', stack:'s'},{label:"ב'", data:D.map(d=>d.b*RB), backgroundColor:'rgba(15,201,139,0.8)', stack:'s'},{label:"מילואים", data:D.map(d=>d.mil_val), backgroundColor:'rgba(248,166,35,0.8)', stack:'s'}] }, options:{ maintainAspectRatio:false, layout:{padding:{top:25}}, scales:{ y:{stacked:true, max:maxVal+10000, grid:{color:'rgba(255,255,255,0.05)'}, ticks:{callback: v=>'₪'+Math.round(v/1000)+'K'}}, x:{stacked:true, ticks:{color:i=>i===CUR_MONTH?'#4E7EF9':'#7A90BE'}} }, plugins:{ legend:{labels:{color:'#7A90BE'}} } } });
}

function calcEnd(startStr, hrs) {
    if (!startStr || !hrs) return '';
    const [h, mi] = startStr.split(':').map(Number);
    const total = h*60+mi+Math.round(hrs*60);
    return `${String(Math.floor(total/60)%24).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
}

function renderTS(){
  const m = tsM, locked = isLocked(m);
  document.getElementById('tsMN').textContent = MN[m];
  document.getElementById('lockMsg').textContent = locked && isAdmin ? "🔒 דוח נעול" : (!isAdmin ? "👁️ מצב צפייה" : "");
  renderGauges('modalGauges');
  let html = "";
  for(let d=1; d<=MD[m]; d++){
    const dw=(4 + [0,31,59,90,120,151,181,212,243,273,304,334][m]+d-1)%7, day=D[m].ts[d]||{emp:'a', start:'08:30', hrs:0};
    const rowClass=(dw>=5?'weekend ':'')+(day.holiday||day.vacation?'dimmed':'');
    html += `<div class="tsrow ${rowClass}"><span style="font-weight:700">${d}</span><span class="day-name">${DN_SHORT[dw]}</span><select class="tsi" ${locked?'disabled':''} onchange="updTS(${d},'emp',this.value)"><option value="a" ${day.emp==='a'?'selected':''}>א'</option><option value="b" ${day.emp==='b'?'selected':''}>ב'</option></select><input type="time" class="tsi" ${locked?'disabled':''} value="${day.start||'08:30'}" onchange="updTS(${d},'start',this.value)"><input type="time" class="tsi" ${locked?'disabled':''} value="${calcEnd(day.start,day.hrs)}" onchange="const[sh,sm]=(D[tsM].ts[${d}].start||'08:30').split(':').map(Number);const[eh,em]=this.value.split(':').map(Number);let di=(eh*60+em)-(sh*60+sm);if(di<0)di+=1440;updTS(${d},'hrs',Math.round((di/60)*2)/2)"><input type="number" class="tsi" ${locked?'disabled':''} value="${valFmt(day.hrs)}" step="0.5" onchange="updTS(${d},'hrs',this.value)"><span style="color:var(--txt3); opacity:0.5; font-size:0.7rem">₪${Math.round(day.hrs*(day.emp==='a'?RA:RB)).toLocaleString()}</span><input type="checkbox" ${locked?'disabled':''} ${day.holiday?'checked':''} onchange="updTS(${d},'hol',this.checked)"><input type="checkbox" ${locked?'disabled':''} ${day.vacation?'checked':''} onchange="updTS(${d},'vac',this.checked)"><input type="text" class="tsi" ${locked?'disabled':''} style="text-align:right" value="${day.note||''}" onchange="updTS(${d},'note',this.value)"></div>`;
    if(day.splitB > 0) {
        const sStart = calcEnd(day.start, day.hrs);
        html += `<div class="tsrow split-b"><span></span><span></span><span style="font-size:0.7rem; font-weight:800; color:var(--rose)">פיצול ב'</span><input type="time" class="tsi" disabled value="${sStart}"><input type="time" class="tsi" disabled value="${calcEnd(sStart, day.splitB)}"><input type="number" class="tsi" ${locked?'disabled':''} value="${day.splitB}" onchange="D[tsM].ts[${d}].splitB=parseFloat(this.value); rebuildTotals(tsM); renderTS(); save();"><span></span><span></span><span></span><span style="font-size:0.6rem">השלמה</span></div>`;
    }
  }
  document.getElementById('tsBody').innerHTML = html;
}

function updTS(d, field, val){
  if(isLocked(tsM)) return;
  if(!D[tsM].ts[d]) D[tsM].ts[d] = {emp:'a', start:'08:30', hrs:0};
  const t = D[tsM].ts[d];
  if(field==='hrs') t.hrs = parseFloat(val)||0;
  if(field==='start') t.start = val;
  if(field==='emp') t.emp = val;
  if(field==='hol' || field==='vac') { t[field==='hol'?'holiday':'vacation']=val; if(val) { t.hrs=0; t.splitB=0; } }
  if(field==='note') t.note = val;
  rebuildTotals(tsM); renderTS(); save();
}

function clearFill(){ if(!isLocked(tsM)) { Object.keys(D[tsM].ts).forEach(d=> { if(D[tsM].ts[d]) { D[tsM].ts[d].auto=false; D[tsM].ts[d].splitB=0; if(D[tsM].ts[d].auto) D[tsM].ts[d].hrs=0; } }); rebuildTotals(tsM); renderTS(); save(); } }
function showToast(m){ const e=document.getElementById('toast'); e.textContent=m; e.style.opacity=1; setTimeout(()=>e.style.opacity=0,3000); }
function openTS(){ tsM = CUR_MONTH; document.getElementById('tsModal').classList.add('open'); renderTS(); }
function closeTS(){ document.getElementById('tsModal').classList.remove('open'); render(); }
function prevM(){ navM = (navM + 11) % 12; render(); }
function nextM(){ navM = (navM + 1) % 12; render(); }
function tsPrev(){ tsM = (tsM + 11) % 12; renderTS(); }
function tsNext(){ tsM = (tsM + 1) % 12; renderTS(); }

load(); render();
</script>
</body>
</html>
